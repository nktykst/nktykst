name: Comprehension review

# 週次で理解負債の状態を Issue に書き出す。
# - レビュー期限が来たエントリ
# - 直近 30 日でコードを変えたのに台帳に載っていないファイル
# Issue は 1 つを使い回す (ラベル comprehension-review)。

on:
  schedule:
    # JST 月曜 08:47 = UTC 日曜 23:47
    - cron: '47 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build report
        id: report
        run: |
          python3 .claude/comprehension/ledger.py report --days 30 > report.md
          cat report.md
          if python3 .claude/comprehension/ledger.py stats --json | python3 -c 'import json,sys; s=json.load(sys.stdin); sys.exit(0 if (s["due"] or s["orphan_files"] or s["over_wip_limit"]) else 1)'; then
            echo "actionable=true" >> "$GITHUB_OUTPUT"
          else
            echo "actionable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update issue
        if: steps.report.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create comprehension-review --description "理解負債の週次レビュー" --color 5319e7 2>/dev/null || true
          existing=$(gh issue list --label comprehension-review --state open --json number --jq '.[0].number')
          title="🧠 理解負債レビュー $(date -u +%Y-%m-%d)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body-file report.md
            gh issue comment "$existing" --body "更新: $(date -u +%Y-%m-%dT%H:%MZ)"
          else
            gh issue create --title "$title" --label comprehension-review --body-file report.md
          fi

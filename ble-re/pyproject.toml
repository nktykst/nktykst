[project]
name = "ble-re"
version = "0.1.0"
description = "BLE リバースエンジニアリング用ツールキット (scan / GATT dump / notify watch / write / btsnoop parse)"
readme = "README.md"
authors = [{ name = "Yukisato Nakata", email = "nktykst@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "bleak>=3.0.2",
]

[project.scripts]
ble-re = "ble_re.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
